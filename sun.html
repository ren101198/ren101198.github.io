<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>吃吃吃</title>
<link rel="icon" href="sun.png">

<style>
:root{
  --main:#ff7a59;
  --bg:#fff3ea;
  --card:#ffffff;
  --soft:#fff7f1;
  --border:#ffd8bd;
}

body{
  font-family: system-ui,"Noto Sans CJK TC",sans-serif;
  margin:0;
  padding:24px;
  background:linear-gradient(135deg,#fff3ea,#ffe9dc);
}

.container{
  max-width:520px;
  margin:0 auto;
  background:var(--card);
  border-radius:20px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{text-align:center;margin:0;font-size:24px}
.subtitle{text-align:center;font-size:13px;color:#666;margin-top:6px}

label{display:block;margin-top:22px;font-weight:600}

select{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--soft);
}

.btn{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:none;
  border-radius:16px;
  background:var(--main);
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.result{
  margin-top:22px;
  padding:18px;
  border-radius:16px;
  background:var(--soft);
  border:1px dashed var(--border);
  text-align:center;
}

.result img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:10px;
}

.fade{animation:fadeIn .3s ease}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1}
}

.card{
  margin-top:22px;
  padding:16px;
  border-radius:16px;
  background:#fff;
  border:1px solid var(--border);
}

.item{
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  background:var(--soft);
  display:flex;
  justify-content:space-between;
}

.favBtn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:4px 8px;
  cursor:pointer;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">
  <h1>🍽 今天要吃什麼？</h1>
  <div class="subtitle">讓系統幫你快速決定</div>

  <label>今天肚子有多餓？</label>
  <select id="hungry">
    <option disabled selected value="">請選擇</option>
    <option>不太餓</option>
    <option>普通</option>
    <option>超級餓</option>
  </select>

  <label>選擇類型</label>
  <select id="type">
    <option disabled selected value="">請先選擇肚子狀態</option>
  </select>

  <button class="btn" id="decideBtn">幫我決定！</button>

  <div id="result" class="result">尚未選擇</div>

  <div class="card">
    <strong>⭐ 收藏清單</strong>
    <div id="favList" style="font-size:13px;color:#666">尚無收藏</div>
  </div>
</div>

<script>
const foods={
  "中式":["三商巧福","陽春麵","八方雲集","便當"],
  "日式":["壽司","拉麵","咖哩飯","丼飯"],
  "韓式":["石鍋拌飯","韓式炸雞","辣炒年糕"],
  "小點心":["蔥抓餅","地瓜球","鬆餅","肉圓"],
  "火鍋":["石二鍋","三媽","老先覺"],
  "速食":["麥當勞","肯德基","漢堡王"],
  "便利商店":["御飯糰","關東煮","泡麵"],
  "福利社":["便當","泡麵","茶葉蛋"]
};

// 類型對應圖片
const typeImg={
  "中式":"https://images.unsplash.com/photo-1604908177522-429d6cfd6e64",
  "日式":"https://images.unsplash.com/photo-1546069901-eacef0df6022",
  "韓式":"https://images.unsplash.com/photo-1604908812566-31c8d4dca1fd",
  "小點心":"https://images.unsplash.com/photo-1504754524776-8f4f37790ca0",
  "火鍋":"https://images.unsplash.com/photo-1585032226651-759b368d7246",
  "速食":"https://images.unsplash.com/photo-1550547660-d9450f859349",
  "便利商店":"https://images.unsplash.com/photo-1604909053191-04f61b2f10d4",
  "福利社":"https://images.unsplash.com/photo-1504674900247-0877df9cc836"
};

const hungry=document.getElementById("hungry");
const type=document.getElementById("type");
const result=document.getElementById("result");
const favList=document.getElementById("favList");

const lightTypes=["小點心","速食","便利商店","福利社"];
const allTypes=Object.keys(foods);

let favorites=JSON.parse(localStorage.getItem("favFoods")||"[]");

function renderTypes(list){
  type.innerHTML='<option disabled selected value="">請選擇</option>';
  list.forEach(t=>{
    const o=document.createElement("option");
    o.textContent=t;
    type.appendChild(o);
  });
}

hungry.onchange=()=>{
  hungry.value==="不太餓"
    ? renderTypes(lightTypes)
    : renderTypes(allTypes);
};

document.getElementById("decideBtn").onclick=()=>{
  if(!type.value){result.textContent="請先選擇類型";return;}
  const pick=foods[type.value][Math.floor(Math.random()*foods[type.value].length)];
  result.innerHTML=`
    <img src="${typeImg[type.value]}">
    <div>😋 ${pick}</div>
    <button class="favBtn" onclick="addFav('${pick}')">加入收藏</button>
  `;
  result.classList.add("fade");
};

function renderFavs(){
  favList.innerHTML=favorites.length?"":"尚無收藏";
  favorites.forEach((f,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`${f}<button class="favBtn" onclick="removeFav(${i})">移除</button>`;
    favList.appendChild(d);
  });
}
function addFav(f){if(!favorites.includes(f))favorites.push(f);save();}
function removeFav(i){favorites.splice(i,1);save();}
function save(){localStorage.setItem("favFoods",JSON.stringify(favorites));renderFavs();}
renderFavs();
</script>
</body>
</html>
