<!DOCTYPE html>
<html>
  <head>
    <title>吃吃吃</title>
    <link rel="icon" href="sun.png">
  </head>
  <body>
<label>肚子餓程度</label>
<select id="hungry">
  <option disabled selected value="">請選擇狀態</option>
  <option value="不太餓">普通 (小點心)</option>
  <option value="超級餓">超級餓 (全餐點)</option>
</select>

<label>選擇餐廳類型</label>
<select id="type">
  <option disabled selected value="">請先選擇肚子狀態</option>
</select>


<button class="btn" id="decideBtn">幫我決定！</button>


<div id="result" class="result small">尚未選擇</div>


<div class="card">
<strong>⭐ 收藏清單</strong>
<div id="favList" class="small" style="margin-top:8px">尚無收藏</div>
</div>
</div>


<script>
const foods={
"中式":["便當","炒飯","陽春麵","鍋燒意麵"],
"日式":["壽司","拉麵","丼飯","咖哩飯"],
"韓式":["石鍋拌飯","韓式炸雞","辣炒年糕"],
"小點心":["蔥抓餅","地瓜球","鬆餅","肉圓"],
"火鍋":["石二鍋","三媽","老先覺"],
"速食":["麥當勞","肯德基","漢堡王"],
"便利商店":["御飯糰","關東煮","泡麵","三明治"],
"福利社":["便當","泡麵","義大利麵","茶葉蛋"]
};


const typeImage={
"中式":"https://images.unsplash.com/photo-1604908177522-429d6cfd6e64",
"日式":"https://images.unsplash.com/photo-1546069901-eacef0df6022",
"韓式":"https://images.unsplash.com/photo-1604908812566-31c8d4dca1fd",
"小點心":"https://images.unsplash.com/photo-1504754524776-8f4f37790ca0",
"火鍋":"https://images.unsplash.com/photo-1585032226651-759b368d7246",
"速食":"https://images.unsplash.com/photo-1550547660-d9450f859349",
"便利商店":"https://images.unsplash.com/photo-1604909053191-04f61b2f10d4",
"福利社":"https://images.unsplash.com/photo-1504674900247-0877df9cc836"
};


const hungry=document.getElementById("hungry");
const type=document.getElementById("type");
const result=document.getElementById("result");
const favList=document.getElementById("favList");


const allTypes=Object.keys(foods);
const lightTypes=["小點心","速食","便利商店","福利社"];


let favorites=JSON.parse(localStorage.getItem("favFoods")||"[]");


function renderTypes(list){
type.innerHTML='<option disabled selected value="">請選擇</option>';
list.forEach(t=>{
const o=document.createElement('option');
o.textContent=t; type.appendChild(o);
});
}


hungry.addEventListener("change",()=>{
if(hungry.value==="不太餓") renderTypes(lightTypes);
else renderTypes(allTypes);
});


function renderFavs(){
if(!favorites.length){favList.textContent="尚無收藏";return;}
favList.innerHTML="";
favorites.forEach((f,i)=>{
const d=document.createElement('div'); d.className='item';
d.innerHTML=`<span>${f}</span>`;
const b=document.createElement('button'); b.textContent='移除'; b.className='favBtn';
b.onclick=()=>{favorites.splice(i,1);saveFavs();renderFavs();};
d.appendChild(b); favList.appendChild(d);
});
}
function saveFavs(){localStorage.setItem('favFoods',JSON.stringify(favorites));}


window.addFav=(name)=>{
if(!favorites.includes(name)) favorites.push(name);
saveFavs(); renderFavs();
}


renderFavs();


document.getElementById("decideBtn").onclick=()=>{
if(!type.value){result.textContent="請先選擇類型";return;}
const list=foods[type.value];
const pick=list[Math.floor(Math.random()*list.length)];
const img=typeImage[type.value];
result.innerHTML=`
<img src="${img}" alt="${type.value}">
<div class="food-name">${pick}</div>
<button class="favBtn" onclick="addFav('${pick}')">加入收藏</button>
`;
};
</script>
</body>
</html>
