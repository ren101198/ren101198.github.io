<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>今天要吃什麼？</title>
<style>
body{font-family:system-ui,Roboto,"Noto Sans CJK TC";margin:0;padding:20px;background:#fff8f2;}
.container{max-width:640px;margin:0 auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
h1{margin:0 0 8px 0;font-size:22px;font-weight:700}
.small{font-size:13px;color:#666}
select{width:100%;padding:10px;border:1px solid #e5e5e5;border-radius:10px;margin-top:8px}
.btn{margin-top:12px;width:100%;padding:10px;border:0;border-radius:10px;background:#ff7a59;color:white;font-size:16px;cursor:pointer}
.card{margin-top:16px;padding:16px;border-radius:10px;background:#fff7ef;border:1px solid #ffe4d6}
.item{padding:10px;border-radius:8px;border:1px solid #eee;margin-top:8px;background:#fff}
.favBtn{margin-left:10px;font-size:14px;padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#fafafa;cursor:pointer}
.resultBox{margin-top:16px;padding:16px;border-radius:10px;background:#fff3e6;border:1px solid #ffd8bd}
</style>
</head>
<body>
<div class="container">
<h1>今天要吃什麼？</h1>
<div class="small">選擇「餐廳類型」→ 系統隨機推薦該類型的招牌料理</div>


<label style="margin-top:16px;display:block">選擇餐廳類型</label>
<select id="type">
<option disabled selected value="">請選擇</option>
<option>中式餐廳</option>
<option>日式料理</option>
<option>韓式料理</option>
<option>美式餐廳</option>
<option>火鍋店</option>
<option>燒烤/烤肉店</option>
<option>速食店</option>
<option>便利商店</option>
</select>


<button class="btn" id="decideBtn">決定要吃什麼！</button>


<div id="result" class="resultBox small">尚未選擇</div>


<div class="card">
<strong>收藏清單</strong>
<div id="favList" class="small" style="margin-top:8px">尚無收藏</div>
</div>
</div>


<script>
const foods = {
"中式餐廳": ["牛肉麵","宮保雞丁","水餃","麻婆豆腐","三杯雞","炒飯"],
"日式料理": ["壽司","拉麵","炸豬排","咖哩飯","照燒雞","烏龍麵"],
"韓式料理": ["石鍋拌飯","部隊鍋","韓式炸雞","辣炒年糕","海鮮煎餅"],
"美式餐廳": ["漢堡","牛排","辣雞翅","凱薩沙拉","披薩"],
"火鍋店": ["麻辣鍋","鴛鴦鍋","海鮮火鍋","牛肉拼盤","蔬菜盤"],
"燒烤/烤肉店": ["烤牛五花","烤豬五花","烤雞腿排","烤蝦","烤蔬菜"],
"速食店": ["炸雞","薯條","漢堡","雞塊","可樂","冰炫風"],
"便利商店": ["御飯糰","便當","關東煮","三明治","沙拉","蒸地瓜","泡麵"]
};


let favorites = JSON.parse(localStorage.getItem("favFoods") || "[]");


const resultEl = document.getElementById("result");
const favListEl = document.getElementById("favList");


function renderFavs(){
if(favorites.length===0){favListEl.textContent = "尚無收藏";return;}
favListEl.innerHTML = "";
favorites.forEach((f,i)=>{
const d=document.createElement('div');
d.className='item';
d.textContent=f;
const btn=document.createElement('button');
btn.textContent='移除';
btn.className='favBtn';
btn.onclick=()=>{favorites.splice(i,1);saveFavs();renderFavs()};
d.appendChild(btn);
favListEl.appendChild(d);
})
}


function saveFavs(){ localStorage.setItem("favFoods",JSON.stringify(favorites)); }


document.getElementById("decideBtn").onclick = ()=>{
const t = document.getElementById("type").value;
if(!t){ resultEl.textContent = "請先選擇餐廳類型"; return; }
const list = foods[t];
const pick = list[Math.floor(Math.random()*list.length)];


resultEl.innerHTML = `<strong>${pick}</strong><br><button class="favBtn" onclick="addFav('${pick}')">加入收藏</button>`;
};


window.addFav = (name)=>{
if(!favorites.includes(name)) favorites.push(name);
saveFavs();
renderFavs();
}


renderFavs();
</script>
</body>
</html>
