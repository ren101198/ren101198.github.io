<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>今天吃什麼喵？</title>
<link rel="icon" href="sun.png">

<style>
:root{
  --main:#ff9aa2;
  --bg:#fff0f3;
  --card:#ffffff;
  --soft:#fff7f9;
  --border:#ffd6dc;
}

body{
  font-family: system-ui,"Noto Sans CJK TC",sans-serif;
  margin:0;
  padding:24px;
  background:
    radial-gradient(circle at 10% 10%, #ffeef2 20%, transparent 21%),
    radial-gradient(circle at 90% 20%, #ffeef2 20%, transparent 21%),
    radial-gradient(circle at 30% 80%, #ffeef2 20%, transparent 21%),
    var(--bg);
}

.container{
  max-width:520px;
  margin:0 auto;
  background:var(--card);
  border-radius:24px;
  padding:26px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  position:relative;
}

.cat-top{
  position:absolute;
  top:-22px;
  right:18px;
  font-size:36px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

h1{
  text-align:center;
  margin:0;
  font-size:24px;
}

.subtitle{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:6px;
}

label{
  display:block;
  margin-top:22px;
  font-weight:700;
}

select{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--soft);
  font-size:15px;
}

.btn{
  width:100%;
  margin-top:26px;
  padding:14px;
  border:none;
  border-radius:18px;
  background:var(--main);
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 6px 0 #e7848c;
}

.btn:active{
  transform:translateY(2px);
  box-shadow:0 4px 0 #e7848c;
}

.result{
  margin-top:22px;
  padding:18px;
  border-radius:18px;
  background:var(--soft);
  border:2px dashed var(--border);
  text-align:center;
  font-size:20px;
  font-weight:800;
}

.result span{
  display:block;
  font-size:26px;
  margin-bottom:6px;
}

.fade{
  animation:pop .35s ease;
}

@keyframes pop{
  0%{opacity:0;transform:scale(.95)}
  100%{opacity:1;transform:scale(1)}
}

.card{
  margin-top:22px;
  padding:16px;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--border);
}

.item{
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  background:var(--soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}

.favBtn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:4px 8px;
  cursor:pointer;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">
  <div class="cat-top">🐱</div>

  <h1>🐾 今天吃什麼喵？</h1>
  <div class="subtitle">交給貓咪幫你決定吧</div>

  <label>😺 今天肚子有多餓？</label>
  <select id="hungry">
    <option disabled selected value="">請選擇</option>
    <option>不太餓</option>
    <option>普通</option>
  </select>

  <label>🍴 選擇類型</label>
  <select id="type">
    <option disabled selected value="">請先選擇肚子狀態</option>
  </select>

  <button class="btn" id="decideBtn">🐟 幫我決定！</button>

  <div id="result" class="result">尚未選擇</div>

  <div class="card">
    <strong>🐾 貓咪收藏清單</strong>
    <div id="favList" style="font-size:13px;color:#777;margin-top:6px">尚無收藏</div>
  </div>
</div>

<script>
const foods={
  "中式":["三商巧福","陽春麵","八方雲集","便當","炒飯","冬粉"],
  "日式":["壽司","拉麵","炸豬排","咖哩飯"],
  "韓式":["石鍋拌飯","韓式炸雞","辣炒年糕"],
  "小點心":["蔥抓餅","地瓜球","鬆餅","肉圓"],
  "火鍋":["石二鍋","老先覺","三媽"],
  "速食":["麥當勞","肯德基","摩斯"],
  "便利商店":["御飯糰","關東煮","泡麵","蒸地瓜"],
  "福利社":["便當","泡麵","義大利麵","茶葉蛋"]
};

const typeIcon={
  "中式":"🍚",
  "日式":"🍣",
  "韓式":"🍲",
  "小點心":"🍡",
  "火鍋":"🍲",
  "速食":"🍔",
  "便利商店":"🏪",
  "福利社":"🏫"
};

const hungry=document.getElementById("hungry");
const type=document.getElementById("type");
const result=document.getElementById("result");
const favList=document.getElementById("favList");

const lightTypes=["小點心","速食","便利商店","福利社"];
const allTypes=Object.keys(foods);

let favorites=JSON.parse(localStorage.getItem("favFoods")||"[]");

function renderTypes(list){
  type.innerHTML='<option disabled selected value="">請選擇</option>';
  list.forEach(t=>{
    const o=document.createElement("option");
    o.textContent=t;
    type.appendChild(o);
  });
}

hungry.onchange=()=>{
  hungry.value==="不太餓"
    ? renderTypes(lightTypes)
    : renderTypes(allTypes);
};

document.getElementById("decideBtn").onclick=()=>{
  if(!type.value){
    result.textContent="🐱 請先選擇類型";
    return;
  }
  const list=foods[type.value];
  const pick=list[Math.floor(Math.random()*list.length)];
  result.innerHTML=
    `<span>${typeIcon[type.value]} ${pick}</span>
     <button class="favBtn" onclick="addFav('${pick}')">加入收藏</button>`;
  result.classList.remove("fade");
  void result.offsetWidth;
  result.classList.add("fade");
};

function renderFavs(){
  if(favorites.length===0){
    favList.textContent="尚無收藏";
    return;
  }
  favList.innerHTML="";
  favorites.forEach((f,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`🐾 ${f}
      <button class="favBtn" onclick="removeFav(${i})">移除</button>`;
    favList.appendChild(d);
  });
}

function addFav(f){
  if(!favorites.includes(f)) favorites.push(f);
  saveFavs();
}
function removeFav(i){
  favorites.splice(i,1);
  saveFavs();
}
function saveFavs(){
  localStorage.setItem("favFoods",JSON.stringify(favorites));
  renderFavs();
}

renderFavs();
</script>
</body>
</html>
